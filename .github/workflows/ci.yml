name: CI

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Optional: existing or new release tag (for example v0.74.0). Leave blank to build artifacts only."
        required: false
        type: string
      release_variant:
        description: "Desktop variant to publish. Select one to repair an incomplete existing release."
        required: true
        default: all
        type: choice
        options: [all, dawa, retail, hospitality, hardware, salon]

# Dedupe runs by commit SHA so retagging or force-pushing same commit
# doesn't cause concurrent duplicate work.
concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Run the shared Rust suite once, before every desktop variant. Keeping tests
  # outside the matrix prevents one designated variant from being the only
  # installer omitted when shared code fails. `pnpm build` is required because
  # Tauri's build.rs validates the configured ../dist bundle resource even for
  # `cargo test --lib`.
  rust-tests:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_version || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node (with pnpm cache)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust test artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: tests

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build configured frontend resource
        env:
          VITE_OMNIX_VARIANT: dawa
        run: pnpm build

      - name: Run shared Rust unit tests
        working-directory: src-tauri
        run: cargo test --lib --locked

  build:
    needs: rust-tests
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write

    # One binary per trade variant. The legacy `pro` multi-module variant
    # is no longer built or sold — it's kept in the code for existing
    # licensees but is not a release target and is intentionally omitted.
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.release_variant != '' && inputs.release_variant != 'all' && format('["{0}"]', inputs.release_variant) || '["dawa","retail","hospitality","hardware","salon"]') }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_version || github.ref }}

      # Decide if this run produces a GitHub Release.
      # Yes when: pushing a tag like v1.2.3 OR workflow_dispatch with release_version.
      - name: Resolve release context
        id: ctx
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          elif [ -n "${{ inputs.release_version }}" ]; then
            TAG="${{ inputs.release_version }}"
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "tag=" >> $GITHUB_OUTPUT
            echo "version=" >> $GITHUB_OUTPUT
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node (with pnpm cache)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        # The Cargo.lock is shared, but each variant has an independent cache
        # key. Every job may therefore save safely; no variant is a single
        # point of failure for cache publication.
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: build-${{ matrix.variant }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild installer BMPs from SVG sources
        run: pnpm build:installer-images

      - name: Regenerate variant icon sets
        run: pnpm icons

      - name: Type-check frontend
        env:
          VITE_OMNIX_VARIANT: ${{ matrix.variant }}
        run: pnpm exec tsc --noEmit

      # Resolve the per-variant Tauri config (Pro uses the base config).
      - name: Resolve Tauri config flag
        id: cfg
        shell: bash
        run: |
          if [ "${{ matrix.variant }}" = "pro" ]; then
            echo "flag=" >> $GITHUB_OUTPUT
          else
            echo "flag=--config src-tauri/tauri.${{ matrix.variant }}.conf.json" >> $GITHUB_OUTPUT
          fi

      - name: Build & sign Tauri app (${{ matrix.variant }})
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_OMNIX_VARIANT: ${{ matrix.variant }}
        shell: bash
        run: |
          npm exec tauri build -- --bundles msi,nsis ${{ steps.cfg.outputs.flag }}

      # ─── Branch / PR / non-tag pushes: upload as artifacts only ───
      - name: Upload installer (artifact)
        if: steps.ctx.outputs.is_release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Omnix-${{ matrix.variant }}-Windows
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi.sig
          if-no-files-found: error
          retention-days: 30

      # ─── Tag pushes / workflow_dispatch with version: also publish release ───
      - name: Generate updater manifest (latest.json)
        if: steps.ctx.outputs.is_release == 'true'
        shell: bash
        run: |
          mkdir -p release-assets

          INSTALLER=$(ls src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe 2>/dev/null | head -1)
          SIG_FILE=$(ls src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sig 2>/dev/null | head -1)

          if [ -z "$INSTALLER" ] || [ -z "$SIG_FILE" ]; then
            echo "ERROR: NSIS installer or signature not found"
            ls -la src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/ || true
            ls -la src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/ || true
            exit 1
          fi

          SIGNATURE=$(cat "$SIG_FILE")
          INSTALLER_NAME=$(basename "$INSTALLER")
          R2_VARIANT_PREFIX="releases/${{ steps.ctx.outputs.tag }}/${{ matrix.variant }}"

          cat > release-assets/latest.json <<EOF
          {
            "version": "${{ steps.ctx.outputs.version }}",
            "variant": "${{ matrix.variant }}",
            "notes": "See https://github.com/${{ github.repository }}/releases/tag/${{ steps.ctx.outputs.tag }}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "windows-x86_64": {
                "signature": "$SIGNATURE",
                "url": "https://media.omnix.co.ke/$R2_VARIANT_PREFIX/$INSTALLER_NAME"
              }
            }
          }
          EOF

          cp src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi release-assets/ 2>/dev/null || true
          cp src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi.sig release-assets/ 2>/dev/null || true
          cp src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe release-assets/ 2>/dev/null || true
          cp src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig release-assets/ 2>/dev/null || true

          ls -la release-assets/

      - name: Upload release assets to the GitHub Release
        if: steps.ctx.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ctx.outputs.tag }}
          name: Omnix ${{ steps.ctx.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.ctx.outputs.tag, '-') }}
          generate_release_notes: true
          files: |
            release-assets/*.msi
            release-assets/*.msi.sig
            release-assets/*.exe
            release-assets/*.exe.sig

      # ─── Artifact publication remains part of the desktop build job. It is
      #     intentionally independent from website metadata availability.
      - name: Mirror release assets to R2 and prepare metadata
        if: steps.ctx.outputs.is_release == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.ctx.outputs.version }}
          TAG: ${{ steps.ctx.outputs.tag }}
          REPO: ${{ github.repository }}
          VARIANT: ${{ matrix.variant }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT || secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.S3_BUCKET || 'omnix-media' }}
          S3_REGION: ${{ vars.S3_REGION || 'auto' }}
          S3_PUBLIC_URL: ${{ vars.S3_PUBLIC_URL || 'https://media.omnix.co.ke' }}
        run: |
          set -euo pipefail

          NSIS=$(find release-assets -maxdepth 1 -type f -name '*-setup.exe' -print -quit)
          MSI=$(find release-assets -maxdepth 1 -type f -name '*.msi' -print -quit)
          NSIS_SIG_FILE=$(find release-assets -maxdepth 1 -type f -name '*-setup.exe.sig' -print -quit)

          if [ -z "$NSIS" ] || [ -z "$NSIS_SIG_FILE" ]; then
            echo "ERROR: NSIS installer or signature missing in release-assets/" >&2
            ls -la release-assets/ || true
            exit 1
          fi

          NSIS_NAME=$(basename "$NSIS")
          MSI_NAME=$(basename "${MSI:-}" 2>/dev/null || echo "")

          # Mirror to R2 under a per-version, per-variant prefix. If R2 is not
          # configured, metadata points at the already-published GitHub assets.
          if [ -n "${S3_ACCESS_KEY_ID:-}" ] && [ -n "${S3_SECRET_ACCESS_KEY:-}" ] && [ -n "${S3_ENDPOINT:-}" ] && [ -n "${S3_BUCKET:-}" ]; then
            export AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID"
            export AWS_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY"
            export AWS_DEFAULT_REGION="${S3_REGION:-auto}"

            R2_PREFIX="releases/$TAG/$VARIANT"
            echo "Mirroring $VARIANT installer → r2://$S3_BUCKET/$R2_PREFIX/"

            aws s3 cp "$NSIS"          "s3://$S3_BUCKET/$R2_PREFIX/$NSIS_NAME"       --endpoint-url "$S3_ENDPOINT" --content-type application/octet-stream --no-progress
            aws s3 cp "$NSIS_SIG_FILE" "s3://$S3_BUCKET/$R2_PREFIX/${NSIS_NAME}.sig" --endpoint-url "$S3_ENDPOINT" --content-type text/plain --no-progress
            if [ -n "${MSI:-}" ]; then
              aws s3 cp "$MSI" "s3://$S3_BUCKET/$R2_PREFIX/$MSI_NAME" --endpoint-url "$S3_ENDPOINT" --content-type application/octet-stream --no-progress
              MSI_SIG_FILE=$(find release-assets -maxdepth 1 -type f -name "${MSI_NAME}.sig" -print -quit)
              [ -n "$MSI_SIG_FILE" ] && aws s3 cp "$MSI_SIG_FILE" "s3://$S3_BUCKET/$R2_PREFIX/${MSI_NAME}.sig" --endpoint-url "$S3_ENDPOINT" --content-type text/plain --no-progress
            fi

            NSIS_URL="${S3_PUBLIC_URL:-https://media.omnix.co.ke}/$R2_PREFIX/$NSIS_NAME"
            MSI_URL=""
            [ -n "$MSI_NAME" ] && MSI_URL="${S3_PUBLIC_URL:-https://media.omnix.co.ke}/$R2_PREFIX/$MSI_NAME"
            echo "✓ R2 NSIS_URL=$NSIS_URL"
            [ -n "$MSI_URL" ] && echo "✓ R2 MSI_URL=$MSI_URL"
          else
            echo "⚠ R2 secrets missing — using GitHub release URLs"
            NSIS_URL="https://github.com/$REPO/releases/download/$TAG/$NSIS_NAME"
            MSI_URL=""
            [ -n "$MSI_NAME" ] && MSI_URL="https://github.com/$REPO/releases/download/$TAG/$MSI_NAME"
          fi

          NSIS_SIZE=$(stat -c '%s' "$NSIS" 2>/dev/null || stat -f '%z' "$NSIS")
          MSI_SIZE=0
          [ -n "${MSI:-}" ] && MSI_SIZE=$(stat -c '%s' "$MSI" 2>/dev/null || stat -f '%z' "$MSI")
          NSIS_SHA=$(sha256sum "$NSIS" 2>/dev/null | awk '{print $1}' || shasum -a 256 "$NSIS" | awk '{print $1}')
          MSI_SHA=""
          [ -n "${MSI:-}" ] && MSI_SHA=$(sha256sum "$MSI" 2>/dev/null | awk '{print $1}' || shasum -a 256 "$MSI" | awk '{print $1}')
          SIGNATURE=$(cat "$NSIS_SIG_FILE")
          MAJOR="${VERSION%%.*}"
          CHANNEL=stable
          [[ "$TAG" == *-* ]] && CHANNEL=beta

          jq -n \
            --arg version "$VERSION" \
            --argjson major "$MAJOR" \
            --arg channel "$CHANNEL" \
            --arg tag "$TAG" \
            --arg variant "$VARIANT" \
            --arg nsisUrl "$NSIS_URL" \
            --arg msiUrl "$MSI_URL" \
            --argjson nsisSize "$NSIS_SIZE" \
            --argjson msiSize "$MSI_SIZE" \
            --arg nsisSha "$NSIS_SHA" \
            --arg msiSha "$MSI_SHA" \
            --arg sig "$SIGNATURE" \
            --arg title "Omnix v$VERSION ($VARIANT)" \
            --arg summary "Omnix $VARIANT $VERSION — bug fixes and improvements." \
            '{
              version: $version,
              variant: $variant,
              majorVersion: $major,
              channel: $channel,
              gitTag: $tag,
              windowsNsisUrl: $nsisUrl,
              windowsMsiUrl: ($msiUrl | select(. != "")),
              windowsNsisSize: $nsisSize,
              windowsMsiSize: ($msiSize | select(. > 0)),
              sha256Nsis: $nsisSha,
              sha256Msi: ($msiSha | select(. != "")),
              updaterSignature: $sig,
              title: $title,
              summary: $summary,
              forcePublish: true
            } | with_entries(select(.value != null))' \
            > release-assets/release-sync.json
          jq -e '.version and .variant and .windowsNsisUrl and .updaterSignature' release-assets/release-sync.json >/dev/null

      - name: Upload desktop metadata sync payload
        if: steps.ctx.outputs.is_release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-sync-${{ matrix.variant }}
          path: release-assets/release-sync.json
          if-no-files-found: error
          retention-days: 30

  # Metadata publication is isolated from artifact publication. When the API is
  # unavailable, the signed installers remain a successful build and this job
  # fails visibly. GitHub's "Re-run failed jobs" can then retry only this matrix
  # using the retained payload artifacts from the successful build matrix.
  sync-desktop-metadata:
    needs: build
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.release_variant != '' && inputs.release_variant != 'all' && format('["{0}"]', inputs.release_variant) || '["dawa","retail","hospitality","hardware","salon"]') }}
    steps:
      - name: Download desktop metadata sync payload
        uses: actions/download-artifact@v4
        with:
          name: desktop-release-sync-${{ matrix.variant }}
          path: release-sync

      - name: Synchronise and verify release metadata (variant=${{ matrix.variant }})
        shell: bash
        env:
          PAYLOAD_SYSTEM_TOKEN: ${{ secrets.PAYLOAD_SYSTEM_TOKEN }}
          PAYLOAD_BASE: ${{ vars.PAYLOAD_BASE_URL || 'https://omnix.co.ke' }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail

          if [ -z "${PAYLOAD_SYSTEM_TOKEN:-}" ]; then
            echo "ERROR: PAYLOAD_SYSTEM_TOKEN is required for desktop metadata synchronisation." >&2
            exit 1
          fi

          BODY_FILE="release-sync/release-sync.json"
          jq -e --arg variant "$VARIANT" \
            '.variant == $variant and .windowsNsisUrl and .updaterSignature' \
            "$BODY_FILE" >/dev/null
          NSIS_URL=$(jq -r '.windowsNsisUrl' "$BODY_FILE")
          SIGNATURE=$(jq -r '.updaterSignature' "$BODY_FILE")

          echo "POSTing release metadata for $VARIANT → $PAYLOAD_BASE/api/releases-sync"
          HTTP_CODE=$(curl --silent --show-error --output /tmp/payload-resp.json --write-out '%{http_code}' \
            --request POST "$PAYLOAD_BASE/api/releases-sync" \
            --header "x-system-token: $PAYLOAD_SYSTEM_TOKEN" \
            --header 'Content-Type: application/json' \
            --data-binary "@$BODY_FILE")
          echo "Response ($HTTP_CODE):"
          cat /tmp/payload-resp.json || true
          echo
          [ "$HTTP_CODE" = "200" ] || { echo "Metadata sync failed (HTTP $HTTP_CODE)" >&2; exit 1; }
          jq -e --arg variant "$VARIANT" --arg exe "$NSIS_URL" \
            '.ok == true and .variant == $variant and .desktop.exe == $exe and .desktop.signatureStored == true' \
            /tmp/payload-resp.json >/dev/null || {
              echo "Metadata response did not confirm the exact variant URL and signature" >&2
              exit 1
            }

          # Exercise the endpoint installed clients poll. It must return this
          # exact URL and Tauri signature; 204 or any mismatch fails loudly.
          VERIFY_URL="$PAYLOAD_BASE/api/releases-latest?variant=$VARIANT&license=0.0.0"
          VERIFY_CODE=$(curl --silent --show-error --output /tmp/updater-resp.json --write-out '%{http_code}' "$VERIFY_URL")
          echo "Updater verification ($VERIFY_CODE):"
          cat /tmp/updater-resp.json || true
          echo
          [ "$VERIFY_CODE" = "200" ] || { echo "Updater manifest unavailable for $VARIANT (HTTP $VERIFY_CODE)" >&2; exit 1; }
          jq -e --arg exe "$(node -e 'process.stdout.write(encodeURI(process.argv[1]))' "$NSIS_URL")" --arg sig "$SIGNATURE" \
            '.platforms["windows-x86_64"].url == $exe and .platforms["windows-x86_64"].signature == $sig' \
            /tmp/updater-resp.json >/dev/null || {
              echo "Updater manifest URL or signature does not match the signed artifact" >&2
              exit 1
            }

  # ─── R2 retention: keep only the latest N release versions ──────────────
  # Installers are large; without pruning the omnix-media bucket grows without
  # bound (every version × 5 variants × 4 files) and crosses Cloudflare's
  # billing threshold. GitHub Releases retain the full history, so R2 only
  # needs the current + previous version for the in-app updater + public
  # download links. Runs after all variants have uploaded.
  prune-r2:
    needs: build
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' && inputs.release_version != '') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    env:
      KEEP: "2"
      S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      S3_ENDPOINT: ${{ vars.S3_ENDPOINT || secrets.S3_ENDPOINT }}
      S3_BUCKET: ${{ vars.S3_BUCKET || 'omnix-media' }}
      S3_REGION: ${{ vars.S3_REGION || 'auto' }}
    steps:
      - name: Prune old release versions from R2 (keep latest N)
        run: |
          set -euo pipefail
          if [ -z "${S3_ACCESS_KEY_ID:-}" ] || [ -z "${S3_SECRET_ACCESS_KEY:-}" ] || [ -z "${S3_ENDPOINT:-}" ]; then
            echo "R2 secrets missing — skipping retention."; exit 0
          fi
          export AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION="${S3_REGION:-auto}"

          # List version folders under releases/ (e.g. v0.69.2)
          aws s3api list-objects-v2 --bucket "$S3_BUCKET" --prefix "releases/" --delimiter / \
            --endpoint-url "$S3_ENDPOINT" --query 'CommonPrefixes[].Prefix' --output text \
            | tr '\t' '\n' | sed 's#releases/##; s#/##' | grep -E '^v[0-9]' > /tmp/vers.txt || true

          COUNT=$(grep -c . /tmp/vers.txt || echo 0)
          echo "Found $COUNT release versions in R2; keeping latest $KEEP."
          if [ "$COUNT" -le "$KEEP" ]; then echo "Nothing to prune."; exit 0; fi

          KEEP_LIST=$(sort -V /tmp/vers.txt | tail -n "$KEEP")
          echo "Keeping: $KEEP_LIST"
          grep -vxF "$KEEP_LIST" /tmp/vers.txt | sort -V > /tmp/del.txt

          while IFS= read -r v; do
            [ -z "$v" ] && continue
            echo "Deleting releases/$v/"
            aws s3 rm "s3://$S3_BUCKET/releases/$v/" --recursive --endpoint-url "$S3_ENDPOINT" --only-show-errors
          done < /tmp/del.txt
          echo "Retention complete — $(grep -c . /tmp/del.txt) old version(s) removed."

  android-release:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_version != '' && (inputs.release_variant == '' || inputs.release_variant == 'all'))
    # Android's Gradle tooling and tauri android init must run on x86_64.
    # The ARM64 development host is not a supported release builder.
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      ANDROID_API_LEVEL: "35"
      ANDROID_BUILD_TOOLS: "35.0.0"
      ANDROID_NDK_VERSION: "28.1.13356709"
      ANDROID_PACKAGE_ID: "co.ke.omnix.app"
      ANDROID_RUST_TARGETS: "aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android"

    steps:
      - name: Resolve immutable release context
        id: release
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="$DISPATCH_TAG"
          fi

          # Android/Play versionCode is derived from stable SemVer. Pre-release
          # allocation needs a separate policy and is intentionally rejected.
          [[ "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || {
            echo "Android releases require a stable vMAJOR.MINOR.PATCH tag: $TAG" >&2
            exit 1
          }
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          (( MINOR < 1000 && PATCH < 1000 )) || {
            echo "minor and patch must each be below 1000" >&2
            exit 1
          }
          VERSION_CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))
          (( VERSION_CODE > 0 && VERSION_CODE <= 2100000000 )) || {
            echo "computed Android versionCode is outside Play's valid range" >&2
            exit 1
          }

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Checkout the tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          fetch-depth: 0

      - name: Require an x86_64 runner and matching release identity
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "x86_64" ]] || {
            echo "tauri android init requires the x86_64 release runner; found $(uname -m)" >&2
            exit 1
          }
          node <<'NODE'
          const fs = require('node:fs')
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'))
          const expectedVersion = process.env.VERSION
          const expectedIdentifier = process.env.ANDROID_PACKAGE_ID
          if (packageJson.version !== expectedVersion || tauri.version !== expectedVersion) {
            throw new Error(`tag version ${expectedVersion} does not match package.json (${packageJson.version}) and tauri.conf.json (${tauri.version})`)
          }
          if (tauri.identifier !== expectedIdentifier) {
            throw new Error(`Android package id must remain ${expectedIdentifier}; found ${tauri.identifier}`)
          }
          NODE

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Rust with every Android ABI target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK, build tools, and NDK
        shell: bash
        run: |
          set -euo pipefail
          # `yes` is killed by SIGPIPE once sdkmanager stops reading, which
          # pipefail would otherwise report as a failed step. Disable pipefail
          # only for this pipeline; `set -e` still fails the step when
          # sdkmanager itself exits non-zero because it is the last command.
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install locked project dependencies
        run: pnpm install --frozen-lockfile

      - name: Decode and inspect the Android release keystore
        id: keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!name:-}" ]] || { echo "missing Android signing secret: $name" >&2; exit 1; }
          done
          KEYSTORE_PATH="$RUNNER_TEMP/omnix-android-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          CERT_SHA256=$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" \
            | awk -F': ' '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')
          [[ "$CERT_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "could not read signing certificate SHA-256" >&2; exit 1; }
          echo "path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Verify the committed Android project and reviewed overlay
        shell: bash
        run: |
          set -euo pipefail
          test -f src-tauri/gen/android/app/build.gradle.kts
          node scripts/verify-android-overlay.mjs --generated

      - name: Apply release identity to the generated Android properties
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const file = 'src-tauri/gen/android/app/tauri.properties'
          // tauri.properties is generated, so it is gitignored and absent on a
          // fresh checkout. Tauri rewrites it during the build from the app
          // version; the release identity is pinned here first so the
          // versionCode policy is enforced rather than inferred.
          const header = '// THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY.'
          let source = fs.existsSync(file) ? fs.readFileSync(file, 'utf8') : header + '\n'
          const replacements = {
            'tauri.android.versionCode': process.env.VERSION_CODE,
            'tauri.android.versionName': process.env.VERSION,
          }
          for (const [key, value] of Object.entries(replacements)) {
            const pattern = new RegExp('^' + key.replaceAll('.', '\\.') + '=.*$', 'm')
            source = pattern.test(source)
              ? source.replace(pattern, key + '=' + value)
              : source.replace(/\n*$/, '') + '\n' + key + '=' + value + '\n'
          }
          fs.mkdirSync(path.dirname(file), { recursive: true })
          fs.writeFileSync(file, source)
          process.stdout.write(fs.readFileSync(file, 'utf8'))
          NODE

      - name: Build signed universal APK and AAB
        env:
          VITE_OMNIX_VARIANT: pro
        run: pnpm tauri android build --ci --apk --aab --target aarch64 --target armv7 --target i686 --target x86_64

      - name: Collect, verify, and checksum Android artifacts
        id: artifacts
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          EXPECTED_CERT_SHA256: ${{ steps.keystore.outputs.cert_sha256 }}
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find src-tauri/gen/android/app/build/outputs/apk -type f -path '*/release/*' -name '*.apk' | sort)
          mapfile -t AABS < <(find src-tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' | sort)
          [[ ${#APKS[@]} -eq 1 ]] || { printf 'expected one universal release APK, found %s\n' "${#APKS[@]}" >&2; printf '%s\n' "${APKS[@]}"; exit 1; }
          [[ ${#AABS[@]} -eq 1 ]] || { printf 'expected one release AAB, found %s\n' "${#AABS[@]}" >&2; printf '%s\n' "${AABS[@]}"; exit 1; }
          [[ "${APKS[0]}" == *universal* ]] || { echo "APK is not the universal output: ${APKS[0]}" >&2; exit 1; }

          mkdir -p release-assets
          APK_NAME="Omnix-${VERSION}-android-universal.apk"
          AAB_NAME="Omnix-${VERSION}-android.aab"
          cp "${APKS[0]}" "release-assets/$APK_NAME"
          cp "${AABS[0]}" "release-assets/$AAB_NAME"

          APK_VERIFY=$("${ANDROID_SDK_ROOT}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify --verbose --print-certs "release-assets/$APK_NAME")
          printf '%s\n' "$APK_VERIFY"
          CERT_SHA256=$(printf '%s\n' "$APK_VERIFY" \
            | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{gsub(":", "", $2); print tolower($2); exit}')
          [[ "$CERT_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "apksigner did not report a valid certificate SHA-256" >&2; exit 1; }
          [[ "$CERT_SHA256" == "$EXPECTED_CERT_SHA256" ]] || {
            echo "APK signing certificate does not match the release keystore" >&2
            exit 1
          }
          # Android app-signing certificates are normally self-signed. Verify
          # the AAB's JAR signature without jarsigner's unrelated PKI strictness.
          jarsigner -verify -verbose -certs "release-assets/$AAB_NAME"
          (
            cd release-assets
            sha256sum "$APK_NAME" "$AAB_NAME" > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "aab_name=$AAB_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$(sha256sum "release-assets/$APK_NAME" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "aab_sha256=$(sha256sum "release-assets/$AAB_NAME" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "apk_size=$(stat -c '%s' "release-assets/$APK_NAME")" >> "$GITHUB_OUTPUT"
          echo "aab_size=$(stat -c '%s' "release-assets/$AAB_NAME")" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"

      - name: Create Android release metadata
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
          APK_NAME: ${{ steps.artifacts.outputs.apk_name }}
          AAB_NAME: ${{ steps.artifacts.outputs.aab_name }}
          APK_SHA256: ${{ steps.artifacts.outputs.apk_sha256 }}
          AAB_SHA256: ${{ steps.artifacts.outputs.aab_sha256 }}
          APK_SIZE: ${{ steps.artifacts.outputs.apk_size }}
          AAB_SIZE: ${{ steps.artifacts.outputs.aab_size }}
          CERT_SHA256: ${{ steps.artifacts.outputs.cert_sha256 }}
          PUBLIC_BASE: ${{ vars.S3_PUBLIC_URL || 'https://media.omnix.co.ke' }}
        run: |
          set -euo pipefail
          PREFIX="releases/$TAG/android"
          jq -n \
            --arg version "$VERSION" \
            --argjson versionCode "$VERSION_CODE" \
            --arg packageId "$ANDROID_PACKAGE_ID" \
            --arg apkUrl "$PUBLIC_BASE/$PREFIX/$APK_NAME" \
            --arg aabUrl "$PUBLIC_BASE/$PREFIX/$AAB_NAME" \
            --argjson apkSize "$APK_SIZE" \
            --argjson aabSize "$AAB_SIZE" \
            --arg apkSha256 "$APK_SHA256" \
            --arg aabSha256 "$AAB_SHA256" \
            --arg signingCertificateSha256 "$CERT_SHA256" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{$version, $versionCode, $packageId, $apkUrl, $aabUrl, $apkSize, $aabSize, $apkSha256, $aabSha256, $signingCertificateSha256, $publishedAt}' \
            > release-assets/android-release.json
          jq -e . release-assets/android-release.json >/dev/null

      - name: Attach APK, AAB, checksums, and metadata to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Omnix ${{ steps.release.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*.apk
            release-assets/*.aab
            release-assets/SHA256SUMS
            release-assets/android-release.json

      - name: Mirror Android artifacts to R2
        shell: bash
        env:
          TAG: ${{ steps.release.outputs.tag }}
          APK_NAME: ${{ steps.artifacts.outputs.apk_name }}
          AAB_NAME: ${{ steps.artifacts.outputs.aab_name }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT || secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ vars.S3_BUCKET || 'omnix-media' }}
          S3_REGION: ${{ vars.S3_REGION || 'auto' }}
        run: |
          set -euo pipefail
          for name in S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY S3_ENDPOINT S3_BUCKET; do
            [[ -n "${!name:-}" ]] || { echo "missing R2 release setting: $name" >&2; exit 1; }
          done
          export AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION="$S3_REGION"
          PREFIX="releases/$TAG/android"
          R2=(--endpoint-url "$S3_ENDPOINT" --no-progress --cache-control 'public,max-age=31536000,immutable')
          aws s3 cp "release-assets/$APK_NAME" "s3://$S3_BUCKET/$PREFIX/$APK_NAME" \
            "${R2[@]}" --content-type application/vnd.android.package-archive
          aws s3 cp "release-assets/$AAB_NAME" "s3://$S3_BUCKET/$PREFIX/$AAB_NAME" \
            "${R2[@]}" --content-type application/octet-stream
          aws s3 cp release-assets/SHA256SUMS "s3://$S3_BUCKET/$PREFIX/SHA256SUMS" \
            "${R2[@]}" --content-type 'text/plain; charset=utf-8'
          aws s3 cp release-assets/android-release.json "s3://$S3_BUCKET/$PREFIX/android-release.json" \
            "${R2[@]}" --content-type application/json

      - name: Sync Android metadata into the existing website release API
        shell: bash
        env:
          RELEASE_INGEST_TOKEN: ${{ secrets.PAYLOAD_SYSTEM_TOKEN }}
          RELEASE_BASE_URL: ${{ vars.PAYLOAD_BASE_URL || 'https://omnix.co.ke' }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
          APK_NAME: ${{ steps.artifacts.outputs.apk_name }}
          AAB_NAME: ${{ steps.artifacts.outputs.aab_name }}
          APK_SHA256: ${{ steps.artifacts.outputs.apk_sha256 }}
          AAB_SHA256: ${{ steps.artifacts.outputs.aab_sha256 }}
          APK_SIZE: ${{ steps.artifacts.outputs.apk_size }}
          AAB_SIZE: ${{ steps.artifacts.outputs.aab_size }}
          CERT_SHA256: ${{ steps.artifacts.outputs.cert_sha256 }}
          PUBLIC_BASE: ${{ vars.S3_PUBLIC_URL || 'https://media.omnix.co.ke' }}
        run: |
          set -euo pipefail
          [[ -n "${RELEASE_INGEST_TOKEN:-}" ]] || { echo "PAYLOAD_SYSTEM_TOKEN is required" >&2; exit 1; }
          PREFIX="releases/$TAG/android"
          APK_URL="$PUBLIC_BASE/$PREFIX/$APK_NAME"
          AAB_URL="$PUBLIC_BASE/$PREFIX/$AAB_NAME"
          BODY=$(jq -n \
            --arg version "$VERSION" \
            --arg variant android \
            --arg platform android \
            --arg channel stable \
            --arg gitTag "$TAG" \
            --arg packageId "$ANDROID_PACKAGE_ID" \
            --argjson versionCode "$VERSION_CODE" \
            --arg apkUrl "$APK_URL" \
            --arg aabUrl "$AAB_URL" \
            --argjson apkSize "$APK_SIZE" \
            --argjson aabSize "$AAB_SIZE" \
            --arg apkSha256 "$APK_SHA256" \
            --arg aabSha256 "$AAB_SHA256" \
            --arg signingCertificateSha256 "$CERT_SHA256" \
            --arg title "Omnix v$VERSION for Android" \
            --arg summary "Signed universal APK for direct distribution; signed AAB retained for later Play use." \
            '{$version, $variant, $platform, $channel, $gitTag, androidPackageId: $packageId, androidVersionCode: $versionCode, androidApkUrl: $apkUrl, androidAabUrl: $aabUrl, androidApkSize: $apkSize, androidAabSize: $aabSize, sha256Apk: $apkSha256, sha256Aab: $aabSha256, androidSigningCertificateSha256: $signingCertificateSha256, $title, $summary, forcePublish: true}')

          HTTP_CODE=$(curl --silent --show-error --output "$RUNNER_TEMP/release-sync.json" --write-out '%{http_code}' \
            --request POST "$RELEASE_BASE_URL/api/releases-sync" \
            --header "x-system-token: $RELEASE_INGEST_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$BODY")
          cat "$RUNNER_TEMP/release-sync.json"
          [[ "$HTTP_CODE" == "200" ]] || { echo "release metadata sync failed: HTTP $HTTP_CODE" >&2; exit 1; }

          # Require the API to acknowledge the exact R2 APK URL before the job succeeds.
          jq -e --arg apkUrl "$APK_URL" \
            '.ok == true and .platform == "android" and .androidApkUrl == $apkUrl' \
            "$RUNNER_TEMP/release-sync.json" >/dev/null
