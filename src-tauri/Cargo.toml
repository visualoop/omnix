[package]
name = "omnix"
version = "0.77.1"
description = "Omnix — The desktop ERP for Kenyan businesses"
authors = ["Omnix"]
edition = "2021"
default-run = "omnix"

[lib]
name = "omnix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-persisted-scope = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
rand = "0.8"
thiserror = "2"
anyhow = "1"
log = "0.4"

# Telemetry
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
once_cell = "1"
dirs = "5"

# Licensing
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
aes-gcm = "0.10"
flate2 = "1"
hex = "0.4"
base64 = "0.22"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
zeroize = "=1.8.2"
sysinfo = "0.32"

# Auto-updater
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# LAN multi-device
axum = "0.7"
axum-server = { version = "=0.8.0", features = ["tls-rustls"] }
rcgen = { version = "=0.13.2", features = ["pem"] }
rustls = { version = "=0.23.40", features = ["ring"] }
rustls-pemfile = "=2.2.0"
webpki-roots = "=1.0.7"
tower-http = { version = "0.6", features = ["cors"] }
mdns-sd = "0.13"
local-ip-address = "0.6"
parking_lot = "0.12"

# Auto-start on system boot (Windows/macOS/Linux)
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"

# Android uses rustls so cross-compilation never requires the host OpenSSL toolchain.
[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls", "charset", "http2"] }
tauri-plugin-http = { version = "=2.5.9", default-features = false, features = ["rustls-tls", "charset", "http2"] }

# Preserve the existing desktop TLS behavior (reqwest default/native TLS and
# tauri-plugin-http's complete default feature set).
[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "=0.12.28", features = ["json"] }
tauri-plugin-http = "=2.5.9"
machine-uid = "0.5"


# Windows-only: register omnix as a real Windows service so the LAN
# server survives user logout / accidental app-quit / power-blip reboots.
# The dedicated `omnix-lan-service` binary (bin/omnix-lan-service.rs) runs
# as the service; the Tauri app just wires the install/uninstall UX.
[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

# Additional binary: the LAN-server-only service worker.
[[bin]]
name = "omnix-lan-service"
path = "src/bin/omnix-lan-service.rs"

# Fixed-purpose elevated helper and WireGuard tunnel service host.
[[bin]]
name = "omnix-mesh-service"
path = "src/bin/omnix-mesh-service.rs"
